[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "gridpulse"
version = "0.2.0"
description = "Open carbon-aware scheduling, grid data and measured savings"
requires-python = ">=3.11"
dependencies = ["duckdb==1.4.3"]
[project.optional-dependencies]
dev = ["pytest==9.0.2"]
[project.scripts]
gridpulse = "gridpulse.cli:main"
gridpulse-mcp = "gridpulse.serve.mcp_server:main"
gridflex-operator = "gridpulse.gridflex.operator:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
gridpulse = ["carbon/*.json", "store/*.sql"]
[tool.pytest.ini_options]
pythonpath = ["src"]
