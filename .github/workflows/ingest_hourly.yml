name: Hourly grid data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Ingest, validate, archive, forecast and publish
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse update --with-us
      - name: Commit good data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observations data/health.json web/public/api
          if ! git diff --cached --quiet; then
            git commit -m 'data: hourly validated grid snapshot'
            git push
          fi
      - name: Detect quarantined regions
        if: success()
        id: health
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path=Path('data/health.json')
          data=json.loads(path.read_text()) if path.exists() else {}
          print('partial='+str(data.get('status')=='partial').lower())
          PY
      - name: Open or update source-failure issue
        if: failure() || steps.health.outputs.partial == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search 'Grid data refresh failed in:title' --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --title 'Grid data refresh failed' --body "A source or data contract failed. Invalid regions keep their last good observations while valid regions may refresh; complete failures retain the published snapshot. Read data/health.json and inspect $RUN_URL. EIA DEMO_KEY is rate limited; configure EIA_API_KEY for more reliable US refreshes."
          else
            gh issue comment "$issue" --body "A source remains quarantined or the refresh failed; last good observations retained for affected regions. Read data/health.json. Inspect $RUN_URL."
          fi
