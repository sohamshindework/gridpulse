name: Hourly grid data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Ingest, validate, archive, forecast and publish
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse update --with-us
      - name: Commit good data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observations web/public/api
          if ! git diff --cached --quiet; then
            git commit -m 'data: hourly validated grid snapshot'
            git push
          fi
      - name: Open or update source-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search 'Grid data refresh failed in:title' --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --title 'Grid data refresh failed' --body "Source ingestion or a data contract failed. The last published snapshot is retained. Inspect $RUN_URL. EIA DEMO_KEY is rate limited; configure EIA_API_KEY for more reliable US refreshes."
          else
            gh issue comment "$issue" --body "Refresh failed again; last published snapshot retained. Inspect $RUN_URL."
          fi
